<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리동네 조사단 · 만족도 통계</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f4fa;color:#17263f;font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:1000px;margin:auto;padding:32px 22px 60px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:30px}.eyebrow{color:#244fc4;font-size:12px;font-weight:700;letter-spacing:.05em}h1{font-size:28px;margin:9px 0}p{line-height:1.7;color:#52617a;font-size:13px}button,a{font:inherit}button{border:1px solid #bccde5;border-radius:10px;background:#fff;color:#244797;padding:10px 16px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card,.panel{background:#fff;border:1px solid #d7e0ed;border-radius:18px;padding:23px}.card span{font-size:13px;color:#52617a}.card strong{display:block;font-size:34px;color:#244fc4;margin-top:14px}.card small{font-size:12px;color:#657389;display:block;margin-top:8px}.panel{margin-top:22px}h2{font-size:18px;margin:0 0 20px}.row{display:grid;grid-template-columns:130px 1fr 65px;gap:20px;align-items:center;padding:17px 0;border-top:1px solid #eef1f7}.track{height:14px;background:#e7edfa;border-radius:20px;overflow:hidden}.fill{height:100%;background:#244fc4;border-radius:20px;transition:width .3s}.score{font-weight:700;text-align:right}.status{padding:12px 16px;border-radius:10px;background:#e5edfb;color:#36558c;line-height:1.7;font-size:12px;margin-bottom:20px}.status.error{background:#fff0ea;color:#973f24}.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.head-row button{font-size:12px;padding:8px 12px}footer{margin-top:24px;color:#52617a;font-size:12px;line-height:1.8}a{color:#244fc4}.dist-row{display:grid;grid-template-columns:100px repeat(5,1fr);gap:8px;font-size:12px;padding:10px 0}.dist-row span{text-align:center;background:#edf3ff;border-radius:6px;padding:6px}.dist-row span:first-child{text-align:left;background:none}button:focus-visible,a:focus-visible{outline:3px solid #c8892 </style></head><body><main class="wrap"><header><div><div class="eyebrow">우리동네 조사단 · 통계</div><h1>관람객의 목소리를 한눈에</h1><p>만족도 조사 응답을 자동으로 집계합니다.</p></div><button id="refresh">새로고침</button></header><div id="status" class="status" role="status" aria-live="polite">집계를 불러오는 중입니다…</div><section class="cards" aria-label="요약"><div class="card"><span>점수 평가 응답</span><strong id="count">—</strong><small>명 / 완성된 평가 기준</small></div><div class="card"><span>전체 문항 평균</span><strong id="average">—</strong><small>5점 만점</small></div><div class="card"><span>전반적 만족도</span><strong id="satisfaction">—</strong><small>5번 문항 평균</small></div></section><section class="panel"><div class="head-row"><h2>항목별 평균</h2><button id="export" disabled>집계 CSV 저장</button></div><div id="chart"></div><p>1점 · 매우 그렇지 않다　/　5점 · 매우 그렇다</p></section><section class="panel" id="distribution" hidden><h2>점수별 응답 분포</h2><div id="distribution-chart"></div></section><footer>15초마다 자동 갱신됩니다. 화면을 벗어나면 갱신을 잠시 멈춥니다.<br>이 페이지는 집계 수치만 표시합니다. 자유 의견은 Google 스프레드시트에서 확인하세요.<br><a href="./index.html">관객 사이트로 이동</a></footer></main><script src="./assets/survey-config.js"></script><script src="./assets/stats.js"></script></body></html>
